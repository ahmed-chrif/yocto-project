DISTRO = "chrif"
DISTRO_NAME = "Chrif Reference DISTIBUTION"
DISTRO_CODENAME = "scarthgap"
DISTRO_VERSION = "1.0"
#Use one tmp dir 
TCLIBCAPPEND = ""
#Minimise GPLv3 packages
require conf/distro/include/no-gplv3.inc
#Enhance security options for CFLAGS/LDFLAGS
require conf/distro/include/security_flags.inc
INIT_MANAGER = "systemd"
DISTRO_FEATURES = "\
    ipv4 \
    ipv6 \
    pcmcia \
    usbgadget \
    usbhost \
    wifi \
    xattr \
    zeroconf \
    vfat \
    seccomp \
    "

#debug tweaks allow no pwd required and ssh server from dropbear cus it has small footprint 
IMAGE_FEATURES += "debug-tweaks ssh-server-dropbear"
IMAGE_INSTALL += " \
    wpa-supplicant \
    linux-firmware-rpidistro-bcm43455 \
"
NO_RECOMMENDATIONS = "1"
# Init system and D-Bus providers (aligned with meta-avocado)
INIT_MANAGER = "systemd"
DISTRO_FEATURES:append = " systemd usrmerge pam"
DISTRO_FEATURES_BACKFILL_CONSIDERED += "sysvinit"
VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_initscripts = "systemd-compat-units"
VIRTUAL-RUNTIME_login_manager = "systemd"
VIRTUAL-RUNTIME_dev_manager = "udev"
VIRTUAL-RUNTIME_dbus = "dbus"

# Direct virtual runtime dbus provider to systemd
VIRTUAL-RUNTIME_dbus = "systemd"
VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_initscripts = ""

# Disable systemd ukify to remove python3-pefile dependency (not used on RPi)
PACKAGECONFIG:remove:pn-systemd = "ukify"

# RPi: no UKI — drop ukify so python3-pefile is not required
PACKAGECONFIG:remove:pn-systemd = "ukify"
