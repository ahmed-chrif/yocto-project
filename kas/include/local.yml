header:
  version: 14

local_conf_header:
    diskmon: |
      BB_DISKMON_DIRS = "\
          STOPTASKS,${TMPDIR},1G,100K \
          STOPTASKS,${DL_DIR},1G,100K \
          STOPTASKS,${SSTATE_DIR},1G,100K \
          STOPTASKS,/tmp,100M,100K \
          HALT,${TMPDIR},100M,1K \
          HALT,${DL_DIR},100M,1K \
          HALT,${SSTATE_DIR},100M,1K \
          HALT,/tmp,10M,1K"
    custom_tweaks: |
      DL_DIR = "/mnt/storage/yocto/downloads"
      SSTATE_DIR = "/mnt/storage/yocto/sstate-cache"
      TMPDIR = "${TOPDIR}/tmp"
      BB_NUMBER_THREADS = "4"
      PARALLEL_MAKE = "-j 4"
      PARALLEL_MAKE:append = " -l 6"
      #do not ecrase the build history on each build, but keep it in the sstate cache
      INHERIT += "buildhistory"
      # Force meta-raspberrypi to append enable_uart=1 to config.txt
      ENABLE_UART = "1"
      # Map high-speed PL011 UART to GPIO 14/15 by disabling Bluetooth (Recommended)
      RPI_EXTRA_CONFIG = "dtoverlay=disable-bt"
